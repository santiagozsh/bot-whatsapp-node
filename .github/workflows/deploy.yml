name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build, Test & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE|BREAKING)"
          minor_pattern: "feat:"
          format: "${major}.${minor}.${patch}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"
          VERSION="${{ steps.semver.outputs.version }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and Push Production Image (In-engine typecheck & tests)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git Tag and GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.semver.outputs.version_tag }}"
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Creating release for ${TAG}..."
            gh release create "${TAG}" \
              --title "Release ${TAG}" \
              --generate-notes
          else
            echo "Release ${TAG} already exists; skipping release creation."
          fi

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted

    steps:
      - name: Pull and Restart Production Container
        run: |
          cd ${{ secrets.DEPLOY_PATH || '/home/jose/santiago/bot-whatsapp-node' }}
          VERSION="${{ needs.build-and-push.outputs.version }}"
          if [ -f .env ]; then
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${VERSION}/" .env
            else
              echo "IMAGE_TAG=${VERSION}" >> .env
            fi
          else
            echo "IMAGE_TAG=${VERSION}" > .env
          fi
          export IMAGE_TAG="${VERSION}"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.prod.yml ps
