services:
  app:
    container_name: node-bot-prod
    image: ghcr.io/santiagozsh/bot-whatsapp-node:${IMAGE_TAG}
    restart: unless-stopped
    volumes:
      - ./auth_info:/app/auth_info
      - ./bot_memory.db:/app/bot_memory.db
      - ./google-keys.json:/app/google-keys.json:ro
    ports:
      - "9090:9090"
    environment:
      NODE_ENV: production
      AUTH_FOLDER_PATH: /app/auth_info
      DB_PATH: /app/bot_memory.db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID}
      SHEETS_INCOME_TAB_NAME: ${SHEETS_INCOME_TAB_NAME}
      SHEETS_SALES_TAB_NAME: ${SHEETS_SALES_TAB_NAME}
      AUTHORIZED_GROUPS: ${AUTHORIZED_GROUPS}
      LOG_LEVEL: ${LOG_LEVEL}
      METRICS_PORT: ${METRICS_PORT}

  alloy:
    container_name: grafana-alloy-prod
    image: grafana/alloy:latest
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY}
    depends_on:
      - app
